<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timpul cu tine ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="timpulcutine">
  <div class="container">
    <h1 class="title">Timpul cu tine 💞</h1>
    
    <img src="img/pozatimpulcutine.jpg" alt="Noi doi" class="photo">
    <p class="message">Timpul trece, dar cu tine, niciodată nu se pierde. ❤️</p>

    <a href="index.html" class="back-button">⬅️ Înapoi la Meniu</a>

    <div id="timer">
      <p><span id="years"></span></p>
      <p><span id="months"></span></p>
      <p><span id="days"></span></p>
      <p><span id="hours"></span></p>
      <p><span id="minutes"></span></p>
      <p><span id="seconds"></span></p>
    </div>

    <div class="hearts"></div>
  </div>

  <script src="timpulcutine.js"></script>
</body>
</html>
